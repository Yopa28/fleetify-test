services:
  mysql:
    image: mysql:8.0
    container_name: fleetify_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: fleetify
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fleetify_backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: fleetify
      WEBHOOK_URL: https://webhook.site/your-webhook-url
    depends_on:
      - mysql

volumes:
  mysql_data:

