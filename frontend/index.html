<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fleetify</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>

<body class="bg-light">

    <div class="container py-4">

        <h1 class="mb-4">Fleetify Maintenance Reports</h1>

        <div class="card mb-4">
            <div class="card-body">

                <h5>Create Report</h5>

                <form id="reportForm">

                    <div class="mb-3">
                        <label class="form-label">Vehicle</label>
                        <select id="vehicle" class="form-select"></select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Odometer</label>
                        <input type="number" id="odometer" class="form-control" />
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Complaint</label>
                        <textarea id="complaint" class="form-control"></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary">
                        Create Report
                    </button>

                </form>

            </div>
        </div>

        <div class="card">
            <div class="card-body">

                <h5>Reports</h5>

                <table class="table" id="reportTable">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Vehicle</th>
                            <th>Status</th>
                            <th>Complaint</th>
                        </tr>
                    </thead>

                    <tbody></tbody>
                </table>

            </div>
        </div>

    </div>

    <script src="./app.js"></script>

</body>

</html>
